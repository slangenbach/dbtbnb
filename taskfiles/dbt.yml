# https://taskfile.dev

version: "3"

tasks:
  get-seed-file:
    dir: analytics/dbtbnb/seeds
    cmds:
      - curl -o seed_full_moon_dates.csv https://dbtlearn.s3.us-east-2.amazonaws.com/seed_full_moon_dates.csv
    status:
      - test -f full_moon_dates.csv
    desc: Download CSV file with full moon dates

  debug:
    dir: analytics/dbtbnb
    cmds:
      - uv run dbt debug
    desc: Debug dbt models

  compile:
    dir: analytics/dbtbnb
    cmds:
      - uv run dbt compile
    desc: Compile dbt models

  run:
    dir: analytics/dbtbnb
    cmds:
      - uv run dbt run
    desc: Run dbt models

  check-freshness:
    dir: analytics/dbtbnb
    cmds:
      - uv run dbt source freshness
    desc: Check freshness of source tables

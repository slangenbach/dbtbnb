# https://taskfile.dev

version: "3"

tasks:
  create-keypair:
    dir: ~/.ssh
    cmds:
      - openssl genrsa 2048 | openssl pkcs8 -topk8 -v2 aes-256-cbc -inform PEM -out {{.KEY_NAME}}.p8 -nocrypt
      - openssl rsa -in {{.KEY_NAME}}.p8 -pubout -out {{.KEY_NAME}}.pub
    status:
      - test -f {{.KEY_NAME}}.p8
      - test -f {{.KEY_NAME}}.pub
    requires:
      vars:
        - name: KEY_NAME
    desc: Create key pair for authentication in Snowflake

  create-user-keypairs:
    cmds:
      - for: [dbt, preset, snowflake_terraform, streamlit]
        task: create-keypair
        vars:
          KEY_NAME: "{{.ITEM}}"
    desc: Create key pairs for Snowflake users

  create-tf-user:
    dir: infra/scripts/
    cmd: |
      snow sql \
        --filename create_terraform_user.sql \
        --variable PUBLIC_KEY={{.PUBLIC_KEY}}
    requires:
      vars:
        - name: PUBLIC_KEY
    desc: Create Terraform service user in Snowflake

  copy-raw-data:
    dir: infra
    cmd: |
      snow sql \
        --filename scripts/copy_raw_data.sql \
        --variable DB_NAME={{.DB_NAME}} \
        --variable SCHEMA_NAME={{.SCHEMA_NAME}} \
        --variable STAGE_NAME={{.STAGE_NAME}} \
        --variable FILE_FORMAT={{.FILE_FORMAT}}
    vars:
      DB_NAME:
        sh: terraform output -json | jq -r .db_name.value
      SCHEMA_NAME:
        sh: terraform output -json | jq -r .raw_schema_name.value
      STAGE_NAME:
        sh: terraform output -json | jq -r .raw_stage_name.value
      FILE_FORMAT:
        sh: terraform output -json | jq -r .raw_file_format.value
    desc: Copy raw data into Snowflake

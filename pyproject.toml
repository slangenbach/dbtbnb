[project]
name = "dbtbnb"
version = "0.1.0"
description = "Learning DBT by transforming Airbnb data"
authors = [
    {name = "Stefan Langenbach", email = "stefan@langenbach.online"}
]
maintainers = [
    {name = "Stefan Langenbach", email = "stefan@langenbach.online"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dagster>=1.12.2",
    "dagster-dbt>=0.28.2",
    "dbt-core>=1.10.13",
    "dbt-snowflake>=1.10.2",
    "pydantic-settings>=2.9.1",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "nbconvert>=7.16.4",
    "pre-commit>=4.0.1",
    "pytest-mock>=3.14.0",
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "ty>=0.0.1a7",
    "dagster-webserver>=1.12.2",
]

ui = [
    "httpx>=0.28.1",
    "pydantic-settings>=2.11.0",
    "pyjwt>=2.10.1",
    "snowflake-connector-python>=3.18.0",
    "streamlit>=1.51.0",
]

[tool.uv]
package = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "B",    # flake8-bugbear
    "BLE",  # flake8-blind-except
    "D",    # pydocstyle
    "DTZ",  # flake8-datetimez
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "PT",   # flake8-pytest-style
    "PTH",  # flake8-use-pathlib
    "S",    # flake8-bandit
    "UP",   # pyupgrade
]
ignore = ["D203", "D212"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["D104"]
"tests/*" = ["S101", "D100", "D103"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers --cov --cov-report=term"
markers = [
    "local: marks tests as running locally only (deselect with '-m \"not local\"')"
]
xfail_strict = true

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
fail_under = 0

[tool.sqlfluff.core]
templater = "dbt"
dialect = "snowflake"
max_line_length = 120

[tool.sqlfluff.templater.dbt]
project_dir = "analytics/dbtbnb"
profiles_dir = "analytics/dbtbnb"

[tool.dagster]
module_name = "dbtbnb.orchestration.definitions"
code_location_name = "orchestration"

[build-system]
requires = ["uv_build>=0.9.4,<0.10.0"]
build-backend = "uv_build"
